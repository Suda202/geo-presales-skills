interface:
  display_name: "GEO 售前报告质量审计"
  short_description: "审计品牌提及、正文首次出现排序、诊断标签与引用；覆盖采集原始层与报告 JSON 层；暂不处理情绪"
  default_prompt: "使用 $geo-presales-report-audit 审核并修正品牌提及与正文首次出现排序。若输入是采集原始响应（还没有 wordid / brand_rankings），先走原始爬虫层品牌抽取：去引用 → 分片抽取 → verify_brand_extraction.py 独立校验（名称在正文、首现顺序、标准名一致性、词典召回）→ 归一标准名 → 排名；校验未通过不得进入指标计算。若输入是报告 JSON，将诊断意图作为独立标签核对，兼容当前既有值与未来自由多标签，并在差异文档中按具体错误原因汇总全部对应记录编号。品牌排名差异须写出具体名称和处理动作，不得只写品牌实体识别、品牌名称规范化或排名提取。不得审计或修改 sentiment；底层结果确认后，将分析结论与上传 CSV 交给 $geo-presales-report-editor。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "使用中立 SKILL.md、项目工具与本地脚本执行"
    claude: "使用中立 SKILL.md、项目工具与本地脚本执行"
    generic: "缺少飞书或浏览器能力时降级为只读审计与待写入清单"
