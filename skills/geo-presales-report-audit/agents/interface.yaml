interface:
  display_name: "GEO 售前报告质量审计"
  short_description: "审计品牌提及、正文首次出现排序、诊断标签与引用；暂不处理情绪"
  default_prompt: "使用 $geo-presales-report-audit 审核并修正这份 GEO 售前 JSON 的品牌提及与正文首次出现排序：将诊断意图作为独立标签核对，兼容当前既有值与未来自由多标签；同时复核品牌实体、引用和正文位置，并在差异文档中按具体错误原因汇总全部对应记录编号。品牌排名差异须写出具体名称和处理动作，不得只写品牌实体识别、品牌名称规范化或排名提取。不得审计或修改 sentiment；底层结果确认后，将分析结论与上传 CSV 交给 $geo-presales-report-editor。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "使用中立 SKILL.md、项目工具与本地脚本执行"
    claude: "使用中立 SKILL.md、项目工具与本地脚本执行"
    generic: "缺少飞书或浏览器能力时降级为只读审计与待写入清单"
