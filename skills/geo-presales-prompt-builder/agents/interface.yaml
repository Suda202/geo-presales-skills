interface:
  display_name: "GEO Presales Prompt Builder"
  short_description: "Build v8 Prompt banks with Topic, Attribute planning, and free Tags"
  default_prompt: "Use $geo-presales-prompt-builder to build an overseas-geo-question-bank/v8 directly from one evaluation Case's Chinese fields. Keep Topic as the primary Prompt container, then derive an Attribute×Topic plan with 3–5 P1 shortlist attributes, 5–10 recommended P2 comparison attributes, up to 10 P3 supplementary attributes, and excluded or accuracy-only facts. Use one free tags array per Prompt: add one default Intent tag, derive Brand Scope: Branded or Non-Branded from actual brand mentions, and add Attribute tags for the attributes the Prompt tests; allow other custom Tags without changing analysis routing. Make each Topic's ordered P1 list exactly match its batch Verification items and Attribute tags; cover P1 with Discovery Attribute tags, then add P2 or P3 Discovery only when it creates distinct diagnostic value. Require Discovery to be a strict majority within every Topic. Let Topic counts differ according to their Attribute coverage, treat 10–25 Prompts per Topic as guidance rather than a hard quota, and keep the full batch at or below 60. Compare shared P1 and high-priority P2 dimensions in isomorphic Competitor Prompts, with one Prompt for each Topic-applicable competitor. Create exactly one Evaluation Prompt per Topic for the target brand only; leave competitor sentiment matrices to aftersales Prompt generation. Preserve Topic-specific competitor boundaries from 补充内容, keep Accuracy at zero, and do not require target_attributes or create diagnosis_intent, per-question attributes, attribute IDs, topic_type, or metric_scopes."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
